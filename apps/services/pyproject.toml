[tool.poetry]
name = "ai-code-review-services"
version = "0.1.0"
description = "Microservice decomposition of the AI Code Review backend."
authors = ["Platform team"]
readme = "README.md"
packages = [
    { include = "common" },
    { include = "api_gateway" },
    { include = "analysis_service" },
    { include = "kb_service" },
    { include = "reviews_service" },
    { include = "org_service" },
    { include = "config_service" },
    { include = "notifications_service" },
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
httpx = "^0.27.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
python-multipart = "^0.0.12"
starlette = "^0.41.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
