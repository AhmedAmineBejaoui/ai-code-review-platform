################################################################################
# Docker Compose for AI Code Review Platform Backend
# 
# This compose file orchestrates:
# - PostgreSQL database
# - Redis (Celery broker + cache)
# - Neo4j (GraphRAG knowledge graph + vectors)
# - MinIO (S3-compatible object storage)
# - FastAPI backend (API server)
# - Celery worker (async analysis pipeline)
# - Prometheus + Grafana (monitoring - optional)
#
# Usage:
#   docker-compose -f docker-compose.complete.yml up -d
#   docker-compose -f docker-compose.complete.yml logs -f backend
#   docker-compose -f docker-compose.complete.yml exec backend alembic upgrade head
#   docker-compose -f docker-compose.complete.yml down -v
################################################################################

version: "3.9"

################################################################################
# Networks
################################################################################
networks:
  backend-net:
    driver: bridge
    name: ai-review-backend-net

################################################################################
# Volumes (persistent data)
################################################################################
volumes:
  postgres-data:
    driver: local
    name: ai-review-postgres-data
  redis-data:
    driver: local
    name: ai-review-redis-data
  neo4j-data:
    driver: local
    name: ai-review-neo4j-data
  neo4j-logs:
    driver: local
    name: ai-review-neo4j-logs
  minio-data:
    driver: local
    name: ai-review-minio-data
  prometheus-data:
    driver: local
    name: ai-review-prometheus-data
  grafana-data:
    driver: local
    name: ai-review-grafana-data

################################################################################
# Services
################################################################################
services:

  # ────────────────────────────────────────────────────────────────────────────
  # PostgreSQL Database
  # ────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ai-review-postgres
    restart: unless-stopped
    networks:
      - backend-net
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_code_review
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ────────────────────────────────────────────────────────────────────────────
  # Redis (Celery broker + Result backend + Cache)
  # ────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ai-review-redis
    restart: unless-stopped
    networks:
      - backend-net
    ports:
      - "6380:6379"
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ────────────────────────────────────────────────────────────────────────────
  # Neo4j (GraphRAG knowledge graph + vector index)
  # ────────────────────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.28-community
    container_name: ai-review-neo4j
    restart: unless-stopped
    networks:
      - backend-net
    ports:
      - "7474:7474"  # HTTP browser UI
      - "7687:7687"  # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/ai-review-neo4j-password
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G

  # ────────────────────────────────────────────────────────────────────────────
  # MinIO (S3-compatible object storage)
  # ────────────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: ai-review-minio
    restart: unless-stopped
    networks:
      - backend-net
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ────────────────────────────────────────────────────────────────────────────
  # FastAPI Backend (API Server)
  # ────────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.complete
      target: runtime
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: ai-review-backend:latest
    container_name: ai-review-backend
    restart: unless-stopped
    networks:
      - backend-net
    ports:
      - "8000:8000"
    env_file:
      - ../../.env  # Load from project root
    environment:
      # Override specific vars for container networking
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ai_code_review
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ai-review-neo4j-password
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
      # App config
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      WORKERS_COUNT: 4
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      # Mount workspace for repo checkout (static analysis)
      - ../../imported_repo:/app/imported_repo
      # Logs persistence
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          memory: 1G
          cpus: '0.5'

  # ────────────────────────────────────────────────────────────────────────────
  # Celery Worker (Async Analysis Pipeline)
  # ────────────────────────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile.complete
      target: worker
    image: ai-review-worker:latest
    container_name: ai-review-worker
    restart: unless-stopped
    networks:
      - backend-net
    env_file:
      - ../../.env
    environment:
      # Override for container networking
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ai_code_review
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ai-review-neo4j-password
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
      # Worker config
      CELERY_POOL: prefork
      CELERY_CONCURRENCY: 4
      CELERY_MAX_TASKS_PER_CHILD: 50
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      # Mount workspace for repo checkout
      - ../../imported_repo:/app/imported_repo
      # Logs persistence
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4'
        reservations:
          memory: 2G
          cpus: '1'

  # ────────────────────────────────────────────────────────────────────────────
  # Prometheus (Metrics collection - optional)
  # ────────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: ai-review-prometheus
    restart: unless-stopped
    networks:
      - backend-net
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    profiles:
      - monitoring

  # ────────────────────────────────────────────────────────────────────────────
  # Grafana (Metrics visualization - optional)
  # ────────────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: ai-review-grafana
    restart: unless-stopped
    networks:
      - backend-net
    ports:
      - "3030:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    profiles:
      - monitoring

################################################################################
# Notes:
# 
# 1. Start core services only:
#    docker-compose -f docker-compose.complete.yml up -d postgres redis neo4j minio backend worker
#
# 2. Start with monitoring:
#    docker-compose -f docker-compose.complete.yml --profile monitoring up -d
#
# 3. Run database migrations:
#    docker-compose -f docker-compose.complete.yml exec backend alembic upgrade head
#
# 4. View logs:
#    docker-compose -f docker-compose.complete.yml logs -f backend
#    docker-compose -f docker-compose.complete.yml logs -f worker
#
# 5. Scale workers:
#    docker-compose -f docker-compose.complete.yml up -d --scale worker=3
#
# 6. Access services:
#    - API: http://localhost:8000
#    - API Docs: http://localhost:8000/docs
#    - Neo4j Browser: http://localhost:7474
#    - MinIO Console: http://localhost:9001
#    - Prometheus: http://localhost:9090 (with --profile monitoring)
#    - Grafana: http://localhost:3030 (with --profile monitoring)
################################################################################
