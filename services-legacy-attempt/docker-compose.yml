version: '3.8'

services:
  # Infrastructure Services
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ai_code_review
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333

  # Core Microservices
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8000:8000"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
      - ANALYSIS_SERVICE_URL=http://analysis-service:8002
      - REVIEW_SERVICE_URL=http://review-service:8003
      - RAG_SERVICE_URL=http://rag-service:8004
      - NOTIFICATION_SERVICE_URL=http://notification-service:8005
    depends_on:
      - auth-service
      - analysis-service
      - review-service
      - rag-service
      - notification-service

  auth-service:
    build: ./services/auth-service
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/ai_code_review
      - CLERK_ISSUER_URL=${CLERK_ISSUER_URL}
      - CLERK_JWKS_URL=${CLERK_JWKS_URL}
      - CLERK_AUTH_ENABLED=${CLERK_AUTH_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy

  analysis-service:
    build: ./services/analysis-service
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/ai_code_review
      - REDIS_URL=redis://redis:6379/0
      - AUTH_SERVICE_URL=http://auth-service:8001
      - WORKER_SERVICE_QUEUE=analysis_tasks
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-service:
    build: ./services/worker-service
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/ai_code_review
      - REDIS_URL=redis://redis:6379/0
      - REVIEW_SERVICE_URL=http://review-service:8003
      - RAG_SERVICE_URL=http://rag-service:8004
      - NOTIFICATION_SERVICE_URL=http://notification-service:8005
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      review-service:
        condition: service_started
      rag-service:
        condition: service_started

  review-service:
    build: ./services/review-service
    ports:
      - "8003:8003"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - LLM_ENABLED=${LLM_ENABLED:-true}
      - RAG_SERVICE_URL=http://rag-service:8004

  rag-service:
    build: ./services/rag-service
    ports:
      - "8004:8004"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_ENABLED=${QDRANT_ENABLED:-true}
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/ai_code_review
    depends_on:
      - qdrant
      postgres:
        condition: service_healthy

  notification-service:
    build: ./services/notification-service
    ports:
      - "8005:8005"
    environment:
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - EMAIL_SMTP_HOST=${EMAIL_SMTP_HOST}
      - EMAIL_SMTP_USER=${EMAIL_SMTP_USER}
      - EMAIL_SMTP_PASS=${EMAIL_SMTP_PASS}

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  default:
    name: ai-code-review-network