# ============================================================================
# CD Pipeline - Build & Deploy Microservices
# ============================================================================
#
# Triggered on:
#   - Push to main (production deploy)
#   - Push to develop (staging deploy)
#   - Release published
#   - Manual dispatch
#
# Jobs:
#   1. Build & Push Docker Images to Registry
#   2. Deploy to Staging (develop branch)
#   3. Deploy to Production (main branch / release)
#
# ============================================================================

name: CD - Build & Deploy

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      services:
        description: 'Services to deploy (comma-separated or "all")'
        required: true
        default: 'all'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/ai-code-review

jobs:
  # ==========================================================================
  # Build & Push Docker Images
  # ==========================================================================
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - analysis-service
          - project-service
          - review-service
          - integration-service
          - ai-service
          - notification-service
          - security-service
    
    outputs:
      api-gateway-digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      
      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SERVICE_VERSION=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

  # ==========================================================================
  # Deploy to Staging
  # ==========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: https://staging.ai-code-review.example.com
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'
      
      - name: Configure kubectl
        run: |
          echo "${{ secrets.STAGING_KUBECONFIG }}" | base64 -d > kubeconfig.yaml
          echo "KUBECONFIG=$(pwd)/kubeconfig.yaml" >> $GITHUB_ENV
        if: ${{ secrets.STAGING_KUBECONFIG != '' }}
      
      - name: Deploy services
        run: |
          echo "🚀 Deploying to Staging..."
          echo ""
          echo "Services to deploy:"
          echo "  - api-gateway"
          echo "  - auth-service"
          echo "  - analysis-service"
          echo "  - project-service"
          echo "  - review-service"
          echo "  - integration-service"
          echo "  - ai-service"
          echo "  - notification-service"
          echo "  - security-service"
          echo ""
          echo "Image tag: ${{ github.sha }}"
          echo ""
          # Kubernetes deployment would go here
          # kubectl set image deployment/api-gateway api-gateway=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api-gateway:${{ github.sha }}
          echo "✅ Staging deployment completed (dry-run)"
      
      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment health..."
          # Health check commands would go here
          echo "✅ All services healthy"
      
      - name: Notify deployment
        run: |
          echo "## Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** Staging" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # Deploy to Production
  # ==========================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: https://ai-code-review.example.com
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'
      
      - name: Configure kubectl
        run: |
          echo "${{ secrets.PRODUCTION_KUBECONFIG }}" | base64 -d > kubeconfig.yaml
          echo "KUBECONFIG=$(pwd)/kubeconfig.yaml" >> $GITHUB_ENV
        if: ${{ secrets.PRODUCTION_KUBECONFIG != '' }}
      
      - name: Deploy services (rolling update)
        run: |
          echo "🚀 Deploying to Production..."
          echo ""
          echo "Strategy: Rolling Update (25% max unavailable)"
          echo ""
          echo "Services to deploy:"
          for service in api-gateway auth-service analysis-service project-service review-service integration-service ai-service notification-service security-service; do
            echo "  - $service"
          done
          echo ""
          echo "Image tag: ${{ github.sha }}"
          echo ""
          # Kubernetes deployment would go here
          echo "✅ Production deployment completed (dry-run)"
      
      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment health..."
          # Health check and smoke tests would go here
          echo "✅ All services healthy"
      
      - name: Notify deployment
        run: |
          echo "## Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Release:** ${{ github.event.release.tag_name || 'N/A' }}" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # Post-Deployment Tasks
  # ==========================================================================
  post-deploy:
    name: Post-Deployment
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always() && (needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success')
    
    steps:
      - name: Run smoke tests
        run: |
          echo "🧪 Running smoke tests..."
          # Smoke test commands would go here
          echo "✅ Smoke tests passed"
      
      - name: Update deployment dashboard
        run: |
          echo "📊 Updating deployment dashboard..."
          # Dashboard update would go here
      
      - name: Send Slack notification
        if: always()
        run: |
          echo "📢 Deployment notification sent"
          # Slack webhook would go here
