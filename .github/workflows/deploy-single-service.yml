# ============================================================================
# Single Service Deployment
# ============================================================================
#
# Deploy a single service without affecting others.
# Useful for hotfixes and isolated updates.
#
# ============================================================================

name: Deploy Single Service

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        required: true
        type: choice
        options:
          - api-gateway
          - auth-service
          - analysis-service
          - project-service
          - review-service
          - integration-service
          - ai-service
          - notification-service
          - security-service
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      skip-tests:
        description: 'Skip tests (for hotfixes)'
        required: false
        type: boolean
        default: false

jobs:
  build-and-test:
    name: Build & Test
    uses: ./.github/workflows/reusable-build-service.yml
    with:
      service-name: ${{ inputs.service }}
      run-tests: ${{ !inputs.skip-tests }}
      push-image: true
      environment: ${{ inputs.environment }}
    secrets: inherit

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-test
    environment:
      name: ${{ inputs.environment }}
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Deploy ${{ inputs.service }} to ${{ inputs.environment }}
        run: |
          echo "🚀 Deploying ${{ inputs.service }} to ${{ inputs.environment }}"
          echo ""
          echo "Image: ${{ needs.build-and-test.outputs.image-tag }}"
          echo "Digest: ${{ needs.build-and-test.outputs.image-digest }}"
          echo ""
          # Kubernetes deployment command would go here
          echo "✅ Deployment complete"
      
      - name: Verify health
        run: |
          echo "🔍 Verifying ${{ inputs.service }} health..."
          # Health check would go here
          echo "✅ Service is healthy"
      
      - name: Summary
        run: |
          echo "## Single Service Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Service:** ${{ inputs.service }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** ${{ needs.build-and-test.outputs.image-tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
