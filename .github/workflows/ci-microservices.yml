# ============================================================================
# CI Pipeline - Microservices Testing
# ============================================================================
#
# Triggered on:
#   - Push to main/develop branches
#   - Pull requests to main/develop
#   - Manual dispatch
#
# Jobs:
#   1. Lint & Type Check (all services in parallel)
#   2. Unit Tests (per service, parallel)
#   3. Integration Tests (requires DB/Redis)
#   4. Build Docker Images (verify builds)
#
# ============================================================================

name: CI - Microservices

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/**'
      - 'apps/backend/**'
      - '.github/workflows/ci-microservices.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/**'
      - 'apps/backend/**'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # ==========================================================================
  # Detect Changed Services
  # ==========================================================================
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      api-gateway: ${{ steps.changes.outputs.api-gateway }}
      auth-service: ${{ steps.changes.outputs.auth-service }}
      analysis-service: ${{ steps.changes.outputs.analysis-service }}
      project-service: ${{ steps.changes.outputs.project-service }}
      review-service: ${{ steps.changes.outputs.review-service }}
      integration-service: ${{ steps.changes.outputs.integration-service }}
      ai-service: ${{ steps.changes.outputs.ai-service }}
      notification-service: ${{ steps.changes.outputs.notification-service }}
      security-service: ${{ steps.changes.outputs.security-service }}
      shared: ${{ steps.changes.outputs.shared }}
      any-service: ${{ steps.changes.outputs.any-service }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            api-gateway:
              - 'services/api-gateway/**'
            auth-service:
              - 'services/auth-service/**'
            analysis-service:
              - 'services/analysis-service/**'
            project-service:
              - 'services/project-service/**'
            review-service:
              - 'services/review-service/**'
            integration-service:
              - 'services/integration-service/**'
            ai-service:
              - 'services/ai-service/**'
            notification-service:
              - 'services/notification-service/**'
            security-service:
              - 'services/security-service/**'
            shared:
              - 'services/shared/**'
            any-service:
              - 'services/**'

  # ==========================================================================
  # Lint & Type Check
  # ==========================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.any-service == 'true'
    
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - analysis-service
          - project-service
          - review-service
          - integration-service
          - ai-service
          - notification-service
          - security-service
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      
      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -r requirements.txt
      
      - name: Run Ruff linter
        working-directory: services/${{ matrix.service }}
        run: |
          ruff check app/ --output-format=github
        continue-on-error: true
      
      - name: Run Ruff formatter check
        working-directory: services/${{ matrix.service }}
        run: |
          ruff format app/ --check
        continue-on-error: true

  # ==========================================================================
  # Unit Tests
  # ==========================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [detect-changes, lint]
    if: needs.detect-changes.outputs.any-service == 'true'
    
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - analysis-service
          - project-service
          - review-service
          - integration-service
          - ai-service
          - notification-service
          - security-service
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      
      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio httpx
          pip install -r requirements.txt
      
      - name: Run unit tests
        working-directory: services/${{ matrix.service }}
        run: |
          pytest tests/unit -v --cov=app --cov-report=xml --cov-report=term-missing || true
        env:
          DATABASE_URL: "postgresql+psycopg://test:test@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379/0"
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: services/${{ matrix.service }}/coverage.xml
          flags: ${{ matrix.service }}
          name: ${{ matrix.service }}-coverage
        continue-on-error: true

  # ==========================================================================
  # Integration Tests
  # ==========================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [detect-changes, unit-tests]
    if: needs.detect-changes.outputs.any-service == 'true'
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx
      
      - name: Install all service dependencies
        run: |
          for service in api-gateway auth-service analysis-service project-service review-service integration-service ai-service notification-service security-service; do
            pip install -r services/$service/requirements.txt
          done
      
      - name: Run integration tests
        run: |
          pytest services/tests/integration -v || true
        env:
          DATABASE_URL: "postgresql+psycopg://postgres:testpass@localhost:5432/test_db"
          REDIS_URL: "redis://localhost:6379/0"
          CLERK_AUTH_ENABLED: "false"

  # ==========================================================================
  # Build Docker Images
  # ==========================================================================
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.any-service == 'true'
    
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - analysis-service
          - project-service
          - review-service
          - integration-service
          - ai-service
          - notification-service
          - security-service
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          push: false
          tags: ai-code-review/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # Summary
  # ==========================================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests, build-images]
    if: always()
    
    steps:
      - name: Check results
        run: |
          echo "## CI Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Images | ${{ needs.build-images.result }} |" >> $GITHUB_STEP_SUMMARY
      
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
