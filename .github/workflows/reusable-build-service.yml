# ============================================================================
# Reusable Workflow - Build & Test Single Service
# ============================================================================
#
# This workflow can be called from other workflows to build and test
# a single microservice. Useful for:
#   - Service-specific pipelines
#   - Hotfix deployments
#   - Manual service rebuilds
#
# ============================================================================

name: Build Service (Reusable)

on:
  workflow_call:
    inputs:
      service-name:
        description: 'Name of the service to build'
        required: true
        type: string
      run-tests:
        description: 'Whether to run tests'
        required: false
        type: boolean
        default: true
      push-image:
        description: 'Whether to push the Docker image'
        required: false
        type: boolean
        default: false
      environment:
        description: 'Deployment environment'
        required: false
        type: string
        default: ''
    outputs:
      image-tag:
        description: 'The Docker image tag that was built'
        value: ${{ jobs.build.outputs.image-tag }}
      image-digest:
        description: 'The Docker image digest'
        value: ${{ jobs.build.outputs.image-digest }}
    secrets:
      REGISTRY_USERNAME:
        required: false
      REGISTRY_PASSWORD:
        required: false

env:
  PYTHON_VERSION: '3.11'
  REGISTRY: ghcr.io

jobs:
  # ==========================================================================
  # Validate Input
  # ==========================================================================
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check service name
        run: |
          VALID_SERVICES="api-gateway auth-service analysis-service project-service review-service integration-service ai-service notification-service security-service"
          if [[ ! " $VALID_SERVICES " =~ " ${{ inputs.service-name }} " ]]; then
            echo "❌ Invalid service name: ${{ inputs.service-name }}"
            echo "Valid services: $VALID_SERVICES"
            exit 1
          fi
          echo "✅ Service name is valid: ${{ inputs.service-name }}"

  # ==========================================================================
  # Lint
  # ==========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install linters
        run: pip install ruff mypy
      
      - name: Run Ruff
        working-directory: services/${{ inputs.service-name }}
        run: ruff check app/ --output-format=github
        continue-on-error: true

  # ==========================================================================
  # Test
  # ==========================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: validate
    if: inputs.run-tests
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: services/${{ inputs.service-name }}/requirements.txt
      
      - name: Install dependencies
        working-directory: services/${{ inputs.service-name }}
        run: |
          pip install pytest pytest-cov pytest-asyncio httpx
          pip install -r requirements.txt
      
      - name: Run tests
        working-directory: services/${{ inputs.service-name }}
        run: pytest tests/ -v --cov=app --cov-report=xml || true
        env:
          DATABASE_URL: "postgresql+psycopg://postgres:testpass@localhost:5432/test_db"
          REDIS_URL: "redis://localhost:6379/0"
      
      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          file: services/${{ inputs.service-name }}/coverage.xml
          flags: ${{ inputs.service-name }}
        continue-on-error: true

  # ==========================================================================
  # Build
  # ==========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always() && !contains(needs.*.result, 'failure')
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Log in to Registry
        if: inputs.push-image
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || github.token }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/ai-code-review/${{ inputs.service-name }}
          tags: |
            type=sha,prefix=
            type=raw,value=${{ inputs.environment }},enable=${{ inputs.environment != '' }}
      
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: services/${{ inputs.service-name }}
          push: ${{ inputs.push-image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
