name: ai-pr-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft && secrets.AI_REVIEW_BACKEND_URL != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch PR diff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sSL \
            -H "Accept: application/vnd.github.v3.diff" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" \
            -o pr.diff

      - name: Run backend AI review
        id: ai_review
        continue-on-error: true
        env:
          AI_REVIEW_BACKEND_URL: ${{ secrets.AI_REVIEW_BACKEND_URL }}
          AI_REVIEW_BEARER_TOKEN: ${{ secrets.AI_REVIEW_BEARER_TOKEN }}
          AI_REVIEW_USER_ID: ${{ secrets.AI_REVIEW_USER_ID }}
        run: |
          python scripts/github_pr_review.py \
            --backend-url "${AI_REVIEW_BACKEND_URL}" \
            --repo "${{ github.repository }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --commit-sha "${{ github.event.pull_request.head.sha }}" \
            --title "${{ github.event.pull_request.title }}" \
            --author "${{ github.event.pull_request.user.login }}" \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --head-ref "${{ github.event.pull_request.head.sha }}" \
            --diff-file pr.diff \
            --output-json ai-review.json \
            --output-markdown ai-review.md

      - name: Publish PR review
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const body = fs.existsSync("ai-review.md")
              ? fs.readFileSync("ai-review.md", "utf8")
              : "## AI Code Review\n\nNo review body was generated.";

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              event: "COMMENT",
              body,
            });

      - name: Fail workflow when backend review fails
        if: steps.ai_review.outcome == 'failure'
        run: |
          echo "Backend AI review failed. Check ai-review.md / ai-review.json in workflow logs." >&2
          exit 1
