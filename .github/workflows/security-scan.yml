# ============================================================================
# Security Scanning
# ============================================================================
#
# Runs security scans on:
#   - Push to main/develop
#   - Pull requests
#   - Weekly schedule
#
# Scans:
#   - CodeQL for code analysis
#   - Trivy for Docker image vulnerabilities
#   - pip-audit for Python dependencies
#
# ============================================================================

name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6 AM
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # ==========================================================================
  # CodeQL Analysis
  # ==========================================================================
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  # ==========================================================================
  # Dependency Vulnerability Scan
  # ==========================================================================
  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - analysis-service
          - project-service
          - review-service
          - integration-service
          - ai-service
          - notification-service
          - security-service
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Install pip-audit
        run: pip install pip-audit
      
      - name: Run pip-audit
        working-directory: services/${{ matrix.service }}
        run: |
          pip-audit -r requirements.txt --format json --output audit-results.json || true
          if [ -f audit-results.json ]; then
            cat audit-results.json | jq '.'
          fi
        continue-on-error: true
      
      - name: Upload audit results
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-${{ matrix.service }}
          path: services/${{ matrix.service }}/audit-results.json
        if: always()

  # ==========================================================================
  # Docker Image Vulnerability Scan
  # ==========================================================================
  trivy-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - analysis-service
          - project-service
          - review-service
          - integration-service
          - ai-service
          - notification-service
          - security-service
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Build image
        run: |
          docker build -t ${{ matrix.service }}:scan services/${{ matrix.service }}
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ matrix.service }}:scan'
          format: 'sarif'
          output: 'trivy-results-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results-${{ matrix.service }}.sarif'
        if: always()

  # ==========================================================================
  # Secret Scanning
  # ==========================================================================
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
        continue-on-error: true

  # ==========================================================================
  # Summary
  # ==========================================================================
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [codeql, dependency-scan, trivy-scan, secret-scan]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL | ${{ needs.codeql.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Scan | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy Image Scan | ${{ needs.trivy-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scan | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
