# ============================================================================
# AI CODE REVIEW PLATFORM - MICROSERVICES DOCKER COMPOSE
# ============================================================================
#
# This file orchestrates all 9 microservices for the AI Code Review Platform.
#
# Services:
#   - api-gateway (port 3000): Routing, Auth, Rate Limiting
#   - auth-service (port 4001): Users, Organizations, Teams, RBAC
#   - analysis-service (port 4002): Code Analysis, Findings
#   - project-service (port 4003): Projects, Repositories, Branches
#   - review-service (port 4004): Reviews, Assignments, Comments
#   - integration-service (port 4005): GitHub, Jira, Slack, Teams
#   - ai-service (port 4006): Knowledge Base, RAG, LLM
#   - notification-service (port 4007): Notifications, Push, Email
#   - security-service (port 4008): Security Issues, Dashboard
#
# Usage:
#   docker-compose -f docker-compose.services.yml up -d
#
# ============================================================================

version: "3.8"

x-service-common: &service-common
  restart: unless-stopped
  networks:
    - ai-review-net
  env_file:
    - .env

services:
  # ==========================================================================
  # API Gateway - Main Entry Point
  # ==========================================================================
  api-gateway:
    <<: *service-common
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "${PORT_API_GATEWAY:-3000}:3000"
    environment:
      - PORT=3000
      - AUTH_SERVICE_URL=http://auth-service:4001
      - ANALYSIS_SERVICE_URL=http://analysis-service:4002
      - PROJECT_SERVICE_URL=http://project-service:4003
      - REVIEW_SERVICE_URL=http://review-service:4004
      - INTEGRATION_SERVICE_URL=http://integration-service:4005
      - AI_SERVICE_URL=http://ai-service:4006
      - NOTIFICATION_SERVICE_URL=http://notification-service:4007
      - SECURITY_SERVICE_URL=http://security-service:4008
    depends_on:
      - auth-service
      - analysis-service
      - project-service
      - review-service
      - integration-service
      - ai-service
      - notification-service
      - security-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # Auth Service - Authentication & Authorization
  # ==========================================================================
  auth-service:
    <<: *service-common
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "${AUTH_SERVICE_PORT:-4001}:4001"
    environment:
      - PORT=4001
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CLERK_AUTH_ENABLED=${CLERK_AUTH_ENABLED:-true}
      - CLERK_ISSUER_URL=${CLERK_ISSUER_URL}
      - CLERK_JWKS_URL=${CLERK_JWKS_URL}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # Analysis Service - Code Analysis Pipeline
  # ==========================================================================
  analysis-service:
    <<: *service-common
    build:
      context: ./analysis-service
      dockerfile: Dockerfile
    container_name: analysis-service
    ports:
      - "${ANALYSIS_SERVICE_PORT:-4002}:4002"
    environment:
      - PORT=4002
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4002/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # Project Service - Projects & Repositories
  # ==========================================================================
  project-service:
    <<: *service-common
    build:
      context: ./project-service
      dockerfile: Dockerfile
    container_name: project-service
    ports:
      - "${PROJECT_SERVICE_PORT:-4003}:4003"
    environment:
      - PORT=4003
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4003/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # Review Service - Code Reviews & Assignments
  # ==========================================================================
  review-service:
    <<: *service-common
    build:
      context: ./review-service
      dockerfile: Dockerfile
    container_name: review-service
    ports:
      - "${REVIEW_SERVICE_PORT:-4004}:4004"
    environment:
      - PORT=4004
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4004/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # Integration Service - GitHub, Jira, Slack, Teams
  # ==========================================================================
  integration-service:
    <<: *service-common
    build:
      context: ./integration-service
      dockerfile: Dockerfile
    container_name: integration-service
    ports:
      - "${INTEGRATION_SERVICE_PORT:-4005}:4005"
    environment:
      - PORT=4005
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_INSTALLATION_ID=${GITHUB_APP_INSTALLATION_ID}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - GITHUB_APP_PRIVATE_KEY_PEM=${GITHUB_APP_PRIVATE_KEY_PEM}
      - JIRA_ENABLED=${JIRA_ENABLED:-false}
      - JIRA_BASE_URL=${JIRA_BASE_URL}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN}
      - SLACK_ENABLED=${SLACK_ENABLED:-false}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - TEAMS_ENABLED=${TEAMS_ENABLED:-false}
      - TEAMS_WEBHOOK_URL=${TEAMS_WEBHOOK_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4005/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # AI Service - Knowledge Base, RAG, LLM
  # ==========================================================================
  ai-service:
    <<: *service-common
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ai-service
    ports:
      - "${AI_SERVICE_PORT:-4006}:4006"
    environment:
      - PORT=4006
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - LLM_ENABLED=${LLM_ENABLED:-true}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-deepseek-coder}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_ENABLED=${QDRANT_ENABLED:-true}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4006/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # Notification Service - Notifications, Push, Email
  # ==========================================================================
  notification-service:
    <<: *service-common
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-4007}:4007"
    environment:
      - PORT=4007
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - PUSH_NOTIFICATIONS_ENABLED=${PUSH_NOTIFICATIONS_ENABLED:-false}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - EMAIL_ENABLED=${EMAIL_ENABLED:-false}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SLACK_ENABLED=${SLACK_ENABLED:-false}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - TEAMS_ENABLED=${TEAMS_ENABLED:-false}
      - TEAMS_WEBHOOK_URL=${TEAMS_WEBHOOK_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4007/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # Security Service - Security Issues & Dashboard
  # ==========================================================================
  security-service:
    <<: *service-common
    build:
      context: ./security-service
      dockerfile: Dockerfile
    container_name: security-service
    ports:
      - "${SECURITY_SERVICE_PORT:-4008}:4008"
    environment:
      - PORT=4008
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECURITY_SCAN_ENABLED=${SECURITY_SCAN_ENABLED:-true}
      - SECRET_SCAN_ENABLED=${SECRET_SCAN_ENABLED:-true}
      - SECRETS_ENCRYPTION_KEY=${SECRETS_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4008/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # Infrastructure Services
  # ==========================================================================
  
  postgres:
    image: postgres:15-alpine
    container_name: ai-review-postgres
    restart: unless-stopped
    networks:
      - ai-review-net
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=simplepass
      - POSTGRES_DB=ai_code_review_platform
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-review-redis
    restart: unless-stopped
    networks:
      - ai-review-net
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai-review-qdrant
    restart: unless-stopped
    networks:
      - ai-review-net
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

networks:
  ai-review-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
