# infra/local/docker-compose.minimal.yml
# Minimal dev stack - Only essential services for development
#
# CORE ONLY: PostgreSQL 15 · Redis 7 · Qdrant (vector store)
# MINIMAL:   No monitoring, no observability, no extra tooling
#
# Usage:
#   make minimal-up     (new command to add to Makefile)
#   docker compose -f infra/local/docker-compose.minimal.yml up -d
#
# Ports summary:
#   5432 → PostgreSQL
#   6380 → Redis
#   6333 → Qdrant REST
#   6334 → Qdrant gRPC

networks:
  ai-review-net:
    driver: bridge

volumes:
  pgdata:           # PostgreSQL data
  qdrant_data:      # Qdrant vector embeddings

services:

  # ═══════════════════════════════════════════════════════════════════════════
  #  CORE INFRASTRUCTURE ONLY
  # ═══════════════════════════════════════════════════════════════════════════

  db:
    image: postgres:15
    container_name: ai-review-postgres-minimal
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: simplepass
      POSTGRES_DB: ai_code_review_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ai-review-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_code_review_platform"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ai-review-redis-minimal
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - ai-review-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ─── Vector Store (Qdrant) ───────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: ai-review-qdrant-minimal
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API + Web dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ai-review-net
    healthcheck:
      test: ["CMD-SHELL", "bash -lc ': > /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s