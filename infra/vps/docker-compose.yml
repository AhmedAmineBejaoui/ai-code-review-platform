services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      dashboard:
        condition: service_healthy
      api:
        condition: service_healthy
      yjs:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  dashboard:
    image: ai-review-dashboard:vps
    build:
      context: ../../apps/dashboard
      dockerfile: Dockerfile
      args:
        <<: *dashboard_build_args
    restart: unless-stopped
    environment:
      <<: *dashboard_common_env
    expose:
      - "3001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3001').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  yjs:
    image: ai-review-dashboard:vps
    build:
      context: ../../apps/dashboard
      dockerfile: Dockerfile
      args:
        <<: *dashboard_build_args
    restart: unless-stopped
    command: ["npm", "run", "start:y-websocket"]
    environment:
      <<: *dashboard_common_env
      PORT: "1234"
    expose:
      - "1234"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:1234').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.9.2
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:RELEASE.2024-03-21T23-13-43Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    volumes:
      - minio_data:/data

  api:
    image: ai-review-backend:vps
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - alembic -c /app/alembic.ini upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      <<: *backend_common_env
    volumes:
      - analysis_workspace:/var/ai-review/workspace
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  worker:
    image: ai-review-backend:vps
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      - celery
      - -A
      - app.workers.celery_app.celery_app
      - worker
      - --loglevel=info
      - -Q
      - analyses
      - --concurrency=2
    environment:
      <<: *backend_common_env
      CELERY_WORKER_POOL: "prefork"
    volumes:
      - analysis_workspace:/var/ai-review/workspace
    depends_on:
      api:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  analysis_workspace:
