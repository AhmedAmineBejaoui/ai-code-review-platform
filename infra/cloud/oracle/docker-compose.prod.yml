name: ai-review-prod

services:
  api:
    build:
      context: ../../../apps/backend
      dockerfile: Dockerfile
    image: ai-review-backend:prod
    restart: unless-stopped
    env_file:
      - ./.env.prod
    environment:
      ENV: prod
      BASE_URL: https://${BACKEND_DOMAIN}
      CELERY_WORKER_POOL: prefork
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\"",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  worker:
    build:
      context: ../../../apps/backend
      dockerfile: Dockerfile
    image: ai-review-backend:prod
    restart: unless-stopped
    env_file:
      - ./.env.prod
    environment:
      ENV: prod
      CELERY_WORKER_POOL: prefork
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info -Q analyses --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      BACKEND_DOMAIN: ${BACKEND_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
